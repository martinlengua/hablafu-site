name: Build and push HablaFu Docker image to ACR

on:
  push:
    branches:
      - master  # Cambia a 'main' si usas main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          enable-AzPSSession: true
      - name: Log in to Azure Container Registry
        run: |
          az acr login --name acrstrategiaapp.azurecr.io  # Cambia al nombre de tu ACR
      - name: Define Tag
        id: vars
        run: echo "TAG=${{ github.run_number }}-${{ github.sha }}" >> $GITHUB_ENV
      - name: Build and push Docker image
        env:
          REGISTRY: acrstrategiaapp.azurecr.io  # Cambia al nombre de tu ACR
          IMAGE_NAME: hablafu-app
          TAG: ${{ env.TAG }}
        run: |
          docker build -t $REGISTRY/$IMAGE_NAME:$TAG .
          docker push $REGISTRY/$IMAGE_NAME:$TAG
      - name: Update HablaFu application
        env:
          REGISTRY: acrstrategiaapp.azurecr.io  # Cambia al nombre de tu ACR
          IMAGE_NAME: hablafu-app
          TAG: ${{ env.TAG }}      
        run: |
          az webapp config container set \
            --name hablafu-studio \  # Cambia al nombre de tu Web App
            --resource-group rg-strategia-app \
            --docker-custom-image-name $REGISTRY/$IMAGE_NAME:$TAG \
            --docker-registry-server-url https://acrstrategiaapp.azurecr.io \  # Cambia a tu ACR URL
            --docker-registry-server-user acrstrategiaapp \  # Cambia al username de ACR
            --docker-registry-server-password ${{ secrets.ACR_KEY }}
      - name: Stop Azure Web App
        run: |
          az webapp stop \
            --name hablafu-studio \  # Cambia al nombre de tu Web App
            --resource-group rg-strategia-app  # Cambia al nombre de tu Resource Group
      - name: Start Azure Web App
        run: |
          az webapp start \
            --name hablafu-studio \  # Cambia al nombre de tu Web App
            --resource-group rg-hablafu  # Cambia al nombre de tu Resource Group  